name: Validate assignment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"

# Each job runs one of the mise tasks that `mise run check` runs locally. No job uses AWS credentials.
jobs:
  lint:
    name: Toolset and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install every pinned tool from mise.lock
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.25"
          install_args: --locked
          cache_key_prefix: mise-toolset
          persist_github_token: false
      - run: mise run lint

  app-test:
    name: App tests with PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: python
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.25"
          install_args: --locked python
          cache_key_prefix: mise-python
          persist_github_token: false
      - run: mise run app:test

  app-smoke:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: python
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.25"
          install_args: --locked python
          cache_key_prefix: mise-python
          persist_github_token: false
      - run: mise run app:smoke
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: terraform
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Terraform
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.25"
          install_args: --locked terraform
          cache_key_prefix: mise-terraform
          persist_github_token: false
      - run: mise run tf:check
