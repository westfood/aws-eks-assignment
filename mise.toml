# Project tool versions. Commit changes together with mise.lock.
# Environments: `mise -E dev|test|prod run <task>` also loads mise.<env>.toml and mise.<env>.local.toml.
min_version = "2026.10.11"

[settings]
# Ensure project tools win over Homebrew/system binaries already on PATH.
activate_aggressive = true

[tools]
terraform = "1.17.1"
python = "3.12.16"
awscli = "2.39.3"
kubectl = "1.36.6"
actionlint = "1.7.12"

# --- Checks (no AWS): the same tasks run locally and in GitHub Actions ---

[tasks."app:setup"]
description = "Create app/.venv and install locked app dependencies"
run = [
  "python -m venv app/.venv",
  "app/.venv/bin/python -m pip install --requirement app/requirements.txt",
  "app/.venv/bin/python -m pip check",
]

[tasks."app:test"]
description = "Run all app tests, including real PostgreSQL tests against the Compose database"
depends = ["app:setup"]
dir = "app"
# Same disposable credentials as compose.yml; the database is published on 127.0.0.1 only.
env = { APP_ENV = "local", DB_AUTH = "password", DB_HOST = "127.0.0.1", DB_PORT = "55432", DB_NAME = "contoso", DB_USER = "contoso_app", DB_PASSWORD = "local-demo-only", DB_SSLMODE = "disable", BOOTSTRAP_DB_USER = "postgres", BOOTSTRAP_DB_PASSWORD = "local-admin-only", RUN_DB_INTEGRATION = "1" }
run = [
  "docker compose up --detach --wait postgres",
  ".venv/bin/python -m unittest discover -s tests -v",
]

[tasks."app:smoke"]
description = "Build the image, run it with Compose and PostgreSQL, write and read a message"
# Both tasks use the Compose database; don't start it twice at the same time.
wait_for = ["app:test"]
run = '''
set -eu
docker compose up --build --detach --wait app
url=http://127.0.0.1:18080
body="compose smoke test $(date -u +%FT%TZ)"
curl -fsS "$url/readyz"; echo
curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"body\":\"$body\"}" "$url/api/messages"; echo
curl -fsS "$url/api/messages" | grep -qF "$body"
# The container must run as the unprivileged app user with a read-only filesystem.
test "$(docker compose exec -T app id -u)" = 10001
if docker compose exec -T app touch /probe 2>/dev/null; then
  echo "Container root filesystem is writable" >&2
  exit 1
fi
echo "Container smoke test passed; stop it with: docker compose down"
'''

[tasks."tf:check"]
description = "Format check, validate and mock-test all Terraform roots without AWS"
run = '''
set -eu
terraform fmt -check -recursive
for root in bootstrap infra platform; do
  terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
  terraform -chdir="$root" validate -no-color
  terraform -chdir="$root" test -no-color
done
'''

[tasks.lint]
description = "Lint the workflow, mise tasks and the Terraform wrapper script"
run = [
  "actionlint",
  "mise tasks validate",
  "bash -n scripts/tf.sh",
]

[tasks.check]
description = "Everything GitHub Actions runs: lint, app tests, container smoke test, Terraform (needs Docker)"
depends = ["lint", "app:test", "app:smoke", "tf:check"]

[tasks."diagrams:export"]
description = "Export draw.io pages (requires draw.io Desktop or DRAWIO_BIN)"
run = "python docs/render_architecture.py"

# --- Environment tasks: always run with -E dev|test|prod ---

[tasks.tf]
description = "Terraform in one root for the selected env, e.g. mise -E dev run tf infra plan"
run = "scripts/tf.sh"

[tasks.image]
description = "Build the committed app/ for linux/amd64 and push it to this env's ECR (skipped if already pushed)"
run = '''
set -eu
repo="$(scripts/tf.sh infra output -raw ecr_repository_url)"
# Tag = Git hash of the committed app/ folder, so infra-only commits don't need a new image.
tag="$(git rev-parse --short HEAD:app)"
if aws ecr describe-images --repository-name "${repo#*/}" --image-ids imageTag="$tag" >/dev/null 2>&1; then
  echo "Already pushed $repo:$tag"
  exit 0
fi
aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
docker buildx build --platform linux/amd64 --provenance=false --tag "$repo:$tag" --push app
echo "Pushed $repo:$tag"
'''

[tasks.kubeconfig]
description = "Write this env's kubeconfig to .kube/<env> (does not touch ~/.kube/config)"
run = 'aws eks update-kubeconfig --name "contoso-$DEPLOY_ENV" --alias "contoso-$DEPLOY_ENV"'

[tasks.smoke]
description = "Check the deployed app: readiness, write a message, read it back"
run = '''
set -eu
url="$(scripts/tf.sh platform output -raw application_url)"
echo "Application: $url"
curl -fsS "$url/readyz"; echo
curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"body\":\"smoke test $(date -u +%FT%TZ)\"}" "$url/api/messages"; echo
curl -fsS "$url/api/messages" | head -c 400; echo
'''
